[project]
name = "automation-tools"
version = "1.0.0"
description = "Production-grade automation suite: AI Job Application Co-Pilot, Skool Community Outreach Assistant, and Conversational Email Outreach & Inbox Copilot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shahid Hasan", email = "shahidhasanpollob@gmail.com" }
]
keywords = [
    "automation",
    "browser-agent",
    "cold-email",
    "job-copilot",
    "skool-automation",
    "fastapi",
    "ai-agent",
    "chrome-extension"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "python-jobspy>=1.1.50",
    "playwright>=1.45.0",
    "browser-use>=0.1.0",
]
